# Standalone development only. Production composition belongs to the deployment repo.
services:
  ai:
    build:
      context: .
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      APP_NAME: ${APP_NAME:-Electronics AI Service}
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: "8001"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL:-http://backend:8000}
      BACKEND_API_TIMEOUT: ${BACKEND_API_TIMEOUT:-10}
